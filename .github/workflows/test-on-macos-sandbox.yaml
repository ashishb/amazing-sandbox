---
name: Test on Mac OS Sandbox

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main, master]
    paths:
      - "**.go"
      - ".github/workflows/test-on-macos-sandbox.yaml"
  pull_request:
    branches: [main, master]
    paths:
      - "**.go"
      - ".github/workflows/test-on-macos-sandbox.yaml"
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Ref: https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/controlling-permissions-for-github_token
permissions:
  contents: read

jobs:

  # Run it locally with https://github.com/nektos/act
  # act -j testGo
  testOnMacOSSandbox:
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          cache-dependency-path: "src/asb/go.mod"
          go-version-file: "src/asb/go.mod"

      # Ref: https://github.com/actions/cache/blob/main/examples.md#go---modules
      - uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build
        working-directory: "src/asb"
        run: "make build"  # output in bin/asb

      - name: Test basic CLI commands
        run: |
          ./src/asb/bin/asb --mode=native help > /dev/null
          ./src/asb/bin/asb --mode=native version

      - name: Install uv for testing it under the sandbox
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0

      - name: Install and configure Poetry
        uses: snok/install-poetry@76e04a911780d5b312d89783f7b1cd627778900a  # v1.4.1


      - name: Test important CLI commands
        # env:
        #    LOG_LEVEL: DEBUG  # Set log level to DEBUG for more verbose output
        run: |
          shopt -s expand_aliases
          alias asb="./src/asb/bin/asb --mode=native"
          # Now the commands
          # Python related
          asb pip --version
          asb poetry --version
          asb uv --version
          asb uvx --version 
          # JavaScript related
          # asb bun --version  # bun is not pre-installed on macOS runners, so we skip it for now
          asb node --version
          # asb pnpm --version # pnpm is not pre-installed on macOS runners, so we skip it for now
          asb npm --version
          asb npx --version
          asb yarn --version
          # Others
          # asb cabal --version
          asb cargo --version
          asb gem --version

      # Print logs in case the test fails, to help debugging
      - name: Print logs
        if: failure()
        run: |
          echo "Printing logs for debugging..."
          # Print the last 100 lines of the log file
          log show --style compact --last 2m --predicate 'sender == "Sandbox"' | tail -n 50
