---
name: Test on GNU/Linux Sandbox

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main, master]
    paths:
      - "**/go.mod"
      - "**/go.sum"
      - "**.go"
      - ".github/workflows/test-on-ubuntu-sandbox.yaml"
  pull_request:
    branches: [main, master]
    paths:
      - "**/go.mod"
      - "**/go.sum"
      - "**.go"
      - ".github/workflows/test-on-ubuntu-sandbox.yaml"
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Ref: https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/controlling-permissions-for-github_token
permissions:
  contents: read

jobs:

  # Run it locally with https://github.com/nektos/act
  # act -j testGo
  testOnUbuntuSandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          cache-dependency-path: "src/asb/go.mod"
          go-version-file: "src/asb/go.mod"

      # Ref: https://github.com/actions/cache/blob/main/examples.md#go---modules
      - uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build
        working-directory: "src/asb"
        run: "make build"  # output in bin/asb

      - name: Install bubblewrap
        run: sudo apt-get -y update && sudo apt-get install -y bubblewrap

      # bubblewrap (bwrap) needs to create a temporary, isolated sandbox environment,
      # but your Linux system is blocking unprivileged users from creating their own user namespaces
      # for security reasons.
      - name: Enable namespaces
        run: |
          # Ubuntu 24.04 or newer
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # Debian / Older Ubuntu / Other distros
          sudo sysctl -w kernel.unprivileged_userns_clone=1

      - name: Test basic CLI commands
        run: |
          ./src/asb/bin/asb --mode=native help > /dev/null
          ./src/asb/bin/asb --mode=native version

      - name: Install uv for testing it under the sandbox
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2

      - name: Install poetry for testing it under the sandbox
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263  # v1.4.2

      - name: Install bun for testing it under the sandbox
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0

      - name: Install pnpm for testing it under the sandbox
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v6.0.9
        with:
          version: 11

      - name: Install zig for testing it under the sandbox
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29  # v2.2.1
        with:
          version: latest

      - name: Test important CLI commands
        # env:
        #    LOG_LEVEL: DEBUG  # Set log level to DEBUG for more verbose output
        run: |
          shopt -s expand_aliases
          alias asb="${PWD}/src/asb/bin/asb --mode=native"
          # Now the commands
          # Python related
          asb pip --version
          # asb poetry --version  # debug why it fails
          asb uv --version
          asb uvx --version 
          # JavaScript related
          asb bun --version
          asb node --version
          # asb pnpm --version  # debug why it fails with exit code 1
          asb npm --version
          asb npx --version
          asb yarn --version
          # Others
          # asb cabal --version
          asb cargo --version
          asb gem --version
          # asb zig version    # debug why it fails with exit code 1

      # Print logs in case the test fails, to help debugging
      - name: Print logs
        if: failure()
        run: |
          echo "Printing logs for debugging..."
          echo "== journalctl (bwrap) =="
          sudo journalctl -ke --no-pager | grep bwrap || echo "No bwrap entries in journalctl"
          echo "== dmesg (apparmor + bwrap) =="
          sudo dmesg | grep -i apparmor | grep bwrap || echo "No apparmor/bwrap entries in dmesg"
